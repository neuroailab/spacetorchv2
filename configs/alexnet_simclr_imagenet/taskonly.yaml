name: alexnet_simclr_imagenet
output_dir: checkpoints/alexnet_simclr_imagenet
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    _feature_blocks.0.1: 0.
    _feature_blocks.2.1: 0.
    _feature_blocks.4.1: 0.
    _feature_blocks.5.1: 0.
    _feature_blocks.6.1: 0.
  position_dir: checkpoints/alexnet_simclr_imagenet/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: alexnet_simclr
  architecture: alexnet_rotnet
  params:
    config: alexnet_simclr_config.yaml
    pretrained_weights: /ccn2/u/ynshah/spacetorchv2/checkpoints/alexnet_simclr_imagenet/alexnet_simclr_imagenet
    resume_path: ""
    dataset_path: /data2/ynshah/imagenet