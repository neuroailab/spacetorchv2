name: tdann_logpolar
output_dir: checkpoints/tdann_logpolar
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    layer1.0: 0.
    layer1.1: 0.
    layer2.0: 0.
    layer2.1: 0.
    layer3.0: 0.
    layer3.1: 0.
    layer4.0: 0.
    layer4.1: 0.
  position_dir: checkpoints/tdann_logpolar/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: tdann
  architecture: resnet18
  params:
    config: tdann_logpolar_config.yaml
    pretrained_weights: ""
    resume_path: ""
    dataset_path: /data2/ynshah/imagenet
