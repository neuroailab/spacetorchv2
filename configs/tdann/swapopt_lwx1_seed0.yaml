name: tdann_optimized
output_dir: checkpoints/tdann/seed_0/
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    layer1.0: 0.25
    layer1.1: 0.25
    layer2.0: 0.25
    layer2.1: 0.25
    layer3.0: 0.25
    layer3.1: 0.25
    layer4.0: 0.25
    layer4.1: 0.25
  position_dir: checkpoints/tdann/positions/swappedon_SineGrating2019
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: tdann
  architecture: resnet18
  params:
    pretrained_weights: checkpoints/tdann/spatial/model_final_checkpoint_phase199_seed0.torch
    dataset_path: ImageNet:split=TRAIN:root=/data/ynshah/imagenet/:extra=/data/ynshah/imagenet/extra
    config: tdann_swapopt_lwx1_seed0_config.yaml