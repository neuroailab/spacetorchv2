name: alexnet_rotnet_imagenet_swapopt_lwx1
output_dir: checkpoints/alexnet_rotnet_imagenet_swapopt_lwx1
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    _feature_blocks.0.1: 0.25
    _feature_blocks.2.1: 0.25
    _feature_blocks.4.1: 0.25
    _feature_blocks.5.1: 0.25
    _feature_blocks.6.1: 0.25
  position_dir: checkpoints/alexnet_rotnet_imagenet/positions/swappedon_SineGrating2019
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: alexnet_rotnet
  architecture: alexnet_rotnet
  params:
    config: alexnet_rotnet_config.yaml
    pretrained_weights: checkpoints/alexnet_rotnet_imagenet_swapopt_lwx1/eval/model_net_epoch50
    resume_path: ""
    dataset_path: /data/ynshah/imagenet