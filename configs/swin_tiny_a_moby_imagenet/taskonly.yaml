name: swin_tiny_a_moby_imagenet
output_dir: checkpoints/swin_tiny_a_moby_imagenet
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    layers.0.blocks.0.attn_output: 0.
    layers.0.blocks.1.attn_output: 0.
    layers.1.blocks.0.attn_output: 0.
    layers.1.blocks.1.attn_output: 0.
    layers.2.blocks.0.attn_output: 0.
    layers.2.blocks.1.attn_output: 0.
    layers.2.blocks.2.attn_output: 0.
    layers.2.blocks.3.attn_output: 0.
    layers.2.blocks.4.attn_output: 0.
    layers.2.blocks.5.attn_output: 0.
    layers.3.blocks.0.attn_output: 0.
    layers.3.blocks.1.attn_output: 0.
  position_dir: checkpoints/swin_tiny_a_moby_imagenet/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: swin_moby
  architecture: swin_tiny_a
  setup:
    train: ""
    model: ""
    eval_model: ""
    config: ""
    eval: ""
  params:
    config: ../Transformer-SSL/configs/moby_swin_tiny.yaml
    pretrained_weights: checkpoints/swin_tiny_moby_imagenet/swin_tiny_moby_imagenet.pth
    resume_path: ""
    dataset_path: /data/ynshah/imagenet