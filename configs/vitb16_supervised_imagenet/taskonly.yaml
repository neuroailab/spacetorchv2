name: vitb16_supervised_imagenet
output_dir: checkpoints/vitb16_supervised_imagenet
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    blocks.0: 0.
    blocks.1: 0.
    blocks.2: 0.
    blocks.3: 0.
    blocks.4: 0.
    blocks.5: 0.
    blocks.6: 0.
    blocks.7: 0.
    blocks.8: 0.
    blocks.9: 0.
    blocks.10: 0.
    blocks.11: 0.
  position_dir: checkpoints/vitb16_supervised_imagenet/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: supervised
  architecture: vitb16
  params:
    config: supervised_config.yaml
    pretrained_weights: checkpoints/vitb16_supervised_imagenet/vitb16_supervised_imagenet.torch
    resume_path: ""
    dataset_path: /data/ynshah/imagenet
