# @package _global_
config:
  CHECKPOINT:
    AUTO_RESUME: true
    CHECKPOINT_FREQUENCY: 100
    DIR: checkpoints/
  DATA:
    NUM_DATALOADER_WORKERS: 4
    TRAIN:
      BATCHSIZE_PER_REPLICA: 32
      COLLATE_FUNCTION: simclr_collator
      COPY_TO_LOCAL_DISK: false
      DATASET_NAMES:
      - imagenet1k_folder
      DATA_LIMIT: -1
      DATA_PATHS:
      - /data2/ynshah/imagenet/train
      DATA_SOURCES:
      - disk_folder
      DROP_LAST: true
      LABEL_TYPE: sample_index
      MMAP_MODE: true
      TRANSFORMS:
      - name: ImgReplicatePil
        num_times: 2
      - name: RandomResizedCrop
        size: 224
      - name: RandomHorizontalFlip
        p: 0.5
      - name: ImgPilColorDistortion
        strength: 1.0
      - name: ImgPilGaussianBlur
        p: 0.5
        radius_max: 2.0
        radius_min: 0.1
      - name: ToTensor
      - mean:
        - 0.485
        - 0.456
        - 0.406
        name: Normalize
        std:
        - 0.229
        - 0.224
        - 0.225
  DISTRIBUTED:
    BACKEND: nccl
    NUM_NODES: 1
    NUM_PROC_PER_NODE: 8
    RUN_ID: auto
  LOG_FREQUENCY: 500
  LOSS:
    name: spatial_correlation_simclr_info_nce_loss
    spatial_correlation_simclr_info_nce_loss:
      buffer_params:
        embedding_dim: 128
      layer_weights:
        _feature_blocks.0.1: 0
        _feature_blocks.2.1: 0
        _feature_blocks.4.1: 0
        _feature_blocks.5.1: 0
        _feature_blocks.6.1: 0
      neighborhoods_per_batch: 1
      temperature: 0.1
      use_old_version: false
  MACHINE:
    DEVICE: gpu
  METERS:
    name: ''
  MODEL:
    HEAD:
      PARAMS:
      - - mlp
        - dims:
          - 6400
          - 4096
          - 4096
          - 2
          use_relu: true
          use_dropout: true
    SYNC_BN_CONFIG:
      CONVERT_BN_TO_SYNC_BN: true
      SYNC_BN_TYPE: pytorch
    TRUNK:
      NAME: spatial_alexnet_bvlc
      TRUNK_PARAMS:
        position_dir: ""
        layer_weights:
          _feature_blocks.0.1: 0
          _feature_blocks.2.1: 0
          _feature_blocks.4.1: 0
          _feature_blocks.5.1: 0
          _feature_blocks.6.1: 0
  MULTI_PROCESSING_METHOD: forkserver
  OPTIMIZER:
    momentum: 0.9
    name: sgd
    nesterov: false
    num_epochs: 100
    param_schedulers:
      lr:
        auto_lr_scaling:
          auto_scale: true
          base_lr_batch_size: 256
          base_value: 0.01
        milestones:
        - 22
        - 45
        - 67
        name: multistep
        update_interval: epoch
        values:
        - 0.01
        - 0.001
        - 0.0001
        - 1.0e-05
    regularize_bias: true
    regularize_bn: false
    use_larc: false
    weight_decay: 5e-04
  SEED_VALUE: 0
  HOOKS:
    TENSORBOARD_SETUP:
      USE_TENSORBOARD: true
  TEST_MODEL: false
  TEST_ONLY: false
  TRAINER:
    TRAIN_STEP_NAME: custom_train_step
  VERBOSE: true
