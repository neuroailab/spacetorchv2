# @package _global_
config:
  CHECKPOINT:
    AUTO_RESUME: true
    CHECKPOINT_FREQUENCY: 100
    DIR: checkpoints/
  DATA:
    NUM_DATALOADER_WORKERS: 5
    TRAIN:
      DATASET_NAMES:
      - imagenet1k_folder
      DATA_LIMIT: -1
      DATA_PATHS:
      - /data2/ynshah/imagenet/train
      DATA_SOURCES:
      - disk_folder
      BATCHSIZE_PER_REPLICA: 32
      TRANSFORMS:
        - name: ImgRotatePil
        - name: RandomResizedCrop
          size: 224
        - name: RandomHorizontalFlip
        - name: ToTensor
        - name: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      MMAP_MODE: True
      COPY_TO_LOCAL_DISK: False
    TEST:
      DATASET_NAMES:
      - imagenet1k_folder
      DATA_LIMIT: -1
      DATA_PATHS:
      - /data2/ynshah/imagenet/val
      DATA_SOURCES:
      - disk_folder
      BATCHSIZE_PER_REPLICA: 32
      TRANSFORMS:
        - name: ImgRotatePil
        - name: Resize
          size: 256
        - name: CenterCrop
          size: 224
        - name: ToTensor
        - name: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      MMAP_MODE: True
      COPY_TO_LOCAL_DISK: False
  DISTRIBUTED:
    BACKEND: nccl
    NUM_NODES: 1
    NUM_PROC_PER_NODE: 8
    RUN_ID: auto
  LOG_FREQUENCY: 500
  LOSS:
    name: spatial_cross_entropy_multiple_output_single_target
    spatial_cross_entropy_multiple_output_single_target:
      buffer_params:
        embedding_dim: 128
      layer_weights:
        _feature_blocks.0.1: 0
        _feature_blocks.2.1: 0
        _feature_blocks.4.1: 0
        _feature_blocks.5.1: 0
        _feature_blocks.6.1: 0
      neighborhoods_per_batch: 1
      temperature: 0.1
      use_old_version: false
  MACHINE:
    DEVICE: gpu
  METERS:
    name: ''
  MODEL:
    HEAD:
      PARAMS:
      - - mlp
        - dims:
          - 6400
          - 4096
          - 4096
          - 4
          use_relu: true
          use_dropout: true
    SYNC_BN_CONFIG:
      CONVERT_BN_TO_SYNC_BN: true
      SYNC_BN_TYPE: pytorch
    TRUNK:
      NAME: spatial_alexnet_bvlc
      TRUNK_PARAMS:
        position_dir: ""
        layer_weights:
          _feature_blocks.0.1: 0
          _feature_blocks.2.1: 0
          _feature_blocks.4.1: 0
          _feature_blocks.5.1: 0
          _feature_blocks.6.1: 0
  MULTI_PROCESSING_METHOD: forkserver
  OPTIMIZER:
    momentum: 0.9
    name: sgd
    nesterov: false
    num_epochs: 50
    param_schedulers:
      lr:
        auto_lr_scaling:
          auto_scale: true
          base_lr_batch_size: 256
          base_value: 0.01
        milestones:
        - 15
        - 30
        - 45
        name: multistep
        update_interval: epoch
        values:
        - 0.01
        - 0.001
        - 0.0001
        - 1.0e-05
    regularize_bias: true
    regularize_bn: false
    use_larc: false
    weight_decay: 5e-04
  SEED_VALUE: 0
  HOOKS:
    TENSORBOARD_SETUP:
      USE_TENSORBOARD: true
  TEST_MODEL: True
  TEST_ONLY: false
  TEST_EVERY_NUM_EPOCH: 5
  TRAINER:
    TRAIN_STEP_NAME: custom_train_step
  VERBOSE: true
