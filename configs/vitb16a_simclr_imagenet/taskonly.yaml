name: vitb16a_simclr_imagenet
output_dir: checkpoints/vitb16a_simclr_imagenet
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    blocks.0.attn: 0.
    blocks.1.attn: 0.
    blocks.2.attn: 0.
    blocks.3.attn: 0.
    blocks.4.attn: 0.
    blocks.5.attn: 0.
    blocks.6.attn: 0.
    blocks.7.attn: 0.
    blocks.8.attn: 0.
    blocks.9.attn: 0.
    blocks.10.attn: 0.
    blocks.11.attn: 0.
  position_dir: checkpoints/vitb16a_simclr_imagenet/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: simclr
  architecture: vitb16a
  params:
    config: simclr_attn_config.yaml
    pretrained_weights: checkpoints/vitb16_simclr_imagenet/vitb16_simclr_imagenet.torch
    resume_path: ""
    dataset_path: /data/ynshah/imagenet
