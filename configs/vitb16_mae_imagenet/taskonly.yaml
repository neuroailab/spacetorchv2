name: vitb16_mae_imagenet
output_dir: checkpoints/vitb16_mae_imagenet
wandb: False
spatial_loss:
  name: 2d_spatial_correlation
  spatial_weight:
    blocks.0: 0.
    blocks.1: 0.
    blocks.2: 0.
    blocks.3: 0.
    blocks.4: 0.
    blocks.5: 0.
    blocks.6: 0.
    blocks.7: 0.
    blocks.8: 0.
    blocks.9: 0.
    blocks.10: 0.
    blocks.11: 0.
  position_dir: checkpoints/vitb16_mae_imagenet/positions
swapopt:
  num_steps: 100000000
  steps_per_neighborhood: 500
variant:
  name: mae
  architecture: vitb16
  setup:
    train: ../mae/engine_pretrain.py
    model: ../mae/models_mae.py
    eval_model: ../mae/models_vit.py
    config: ""
    eval: ../mae/engine_finetune.py
  params:
    config: ""
    pretrained_weights: checkpoints/vitb16_mae_imagenet/vitb16_mae_imagenet.pth
    resume_path: ""
    dataset_path: /data/ynshah/imagenet/
